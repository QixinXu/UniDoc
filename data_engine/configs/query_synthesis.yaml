# Query Synthesis Configuration
# This configuration file is used for synthesizing question-answer pairs from documents.

# Model configuration
model:
  # Model type: "vllm_server" for using vLLM inference server
  model_type: "vllm_server"
  
  # Model name/path - use a VL (Vision-Language) model
  model_name: "Qwen/Qwen2-VL-7B-Instruct"
  
  # Additional model arguments
  model_args:
    # vLLM server address (port will be set via command line)
    url: "http://localhost"
    
    # Maximum tokens to generate
    max_tokens: 2048
    
    # Sampling parameters
    temperature: 0.7
    top_p: 0.95

# Input configuration
input:
  # Path to directory containing parsed PDF documents (JSON files)
  raw_data_path: "/path/to/your/parsed/documents"
  
  # Maximum number of files to process (set to -1 for all)
  max_num_files: 100

# Output configuration
output:
  # Directory prefix for output files
  file_prefix: "./output/queries"
  
  # Directory to save extracted images
  image_dir: "./output/images"

# Processing configuration
processing:
  # Whether to process figures
  process_figures: true
  
  # Whether to process tables
  process_tables: true
  
  # Whether to process pure text
  process_text: false
  
  # Number of samples to generate per anchor (for diversity)
  num_samples: 1
  
  # Whether to extract key points before synthesis
  extract_keypoints: true
