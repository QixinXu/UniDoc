### model
model_name_or_path: /map-vepfs/models/Qwen2.5-VL-7B-Instruct/
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: 2d4kfigure_stage1_every_page_retrival
template: qwen2_vl
cutoff_len: 18000
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /map-vepfs/haozhe/xuqixin/LLaMA-Factory/checkpoints/qwen2_5vl-7b/2d4kfigure_stage1_every_image_retrival_5epoch/
logging_steps: 1
save_steps: 149
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: swanlab  # choices: [none, wandb, tensorboard, swanlab, mlflow]
use_swanlab: true
swanlab_run_name: 2d4kfigure_stage1_every_image_retrival_5epoch # optional

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

