### model
model_name_or_path: /map-vepfs/models/Qwen2.5-VL-7B-Instruct/
image_max_pixels: 1204224
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: stage2_collection_vcentric_sampled
template: qwen2_vl
cutoff_len: 16384
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: /map-vepfs/haozhe/xuqixin/LLaMA-Factory/checkpoints/qwen2_5vl-7b/stage2_11k_vcentric/
logging_steps: 1
save_steps: 30
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: swanlab  # choices: [none, wandb, tensorboard, swanlab, mlflow]
use_swanlab: true
swanlab_run_name: 11k_stage2_vcentric # optional

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: /map-vepfs/haozhe/xuqixin/LLaMA-Factory/checkpoints/qwen2_5vl-7b/stage2_11k_vcentric/checkpoint-150

