### dataset
dataset: 2d4kfigure_stage1_every_page_retrival,3d7kfigure_stage1_every_page_slidevqa_retrival,5d1kfigure_stage1_every_page_dude_retrival,1k_stage1_every_page_dude_retrival_unanswerable,1k_stage1_every_page_slidevqa_retrival_unanswerable,0d4k_stage1_every_page_syn_retrival_unanswerable_multipage,1d2k_stage1_every_page_syn_retrival_answerable_multipage,17k_stage2_sample_v4
template: qwen2_vl
cutoff_len: 16384
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
